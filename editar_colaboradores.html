<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adicionando Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/editar_colaboradores.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <title>Cadastro de Colaboradores</title>
</head>

<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Editar Colaboradores</h1>
        </div>

        <div class="content">
            <!-- Área da esquerda: Formulário de matrícula e edição -->
            <div class="form-container">
                <!-- Campo de matrícula e pesquisa -->
                <div class="search-bar">
                    <input type="text" placeholder="Digite a matrícula" id="matriculaPesquisar" class="form-control">
                    <button id="pesquisar" class="btn btn-primary">
                        <i class="fas fa-search"></i> Pesquisar
                    </button>
                </div>

                <!-- Formulário de dados do colaborador -->
                <div class="form" id="formEditar">
                    <div class="form-field">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" placeholder="Nome do colaborador" class="form-control">
                    </div>
                    <div class="form-field">
                        <label for="cargo">Cargo</label>
                        <input type="text" id="cargo" placeholder="Cargo do colaborador" class="form-control">
                    </div>
                    <div class="form-field">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" placeholder="CPF do colaborador" class="form-control">
                    </div>
                    <div class="form-field">
                        <label for="situacao">Situação</label>
                        <select id="situacao" class="form-select">
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>
                    </div>
                    <!-- Div para mostrar as mensagens -->
                    <div id="mensagem" class="mensagem" style="display: none;"></div>
                </div>

                <!-- Botões de ação -->
                <div class="form-buttons">
                    <button class="btn btn-success" id="btnSalvar">Salvar</button>
                    <button class="btn btn-secondary" id="btnLimpar">Limpar</button>
                    <button class="btn btn-danger" id="btnCancelar">Cancelar</button>
                </div>
            </div>

            <!-- Área da direita: Informações do usuário e cadastro de colaboradores -->
            <div class="user-info">
                <h2>Bem-vindo</h2>
                <p><strong>Usuário:</strong> </p>
                <p><strong>Mat:</strong> </p>
                <div class="user-image" data-tooltip="Tela Inicial">
                    <a href="tela_financeiro.html"><img src="imagens/logo-de-usuarios.png" alt="Usuário"></a>
                </div>
                <div class="mini-menu">
                    <div class="mini-item" data-tooltip="Cadastrar Colaboradores">
                        <a href="tela_cadastro_colaboradores.html"><img src="imagens/lgo-cadastrar-colaboradores.png" alt="Colaboradores"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Cadastrar Loja">
                        <a href="cadastro_lojas.html"> <img src="imagens/cadastrar-loja.png" alt="Cadastrar Loja"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Colaboradores">
                        <a href="listar_colaboradores.html"><img src="imagens/listar-colaboradores.png" alt="Listar Colaboradores"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Lojas">
                        <a href="listar_lojas.html"><img src="imagens/listar-lojas.png" alt="Listar Lojas"></a>
                    </div>
                    <div class="mini-item disabled" data-tooltip="Editar Colaboradores">
                        <a href="editar_colaboradores.html"><img src="imagens/editar-colaboradores.png" alt="Editar Colaboradores"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Editar Lojas">
                        <a href="editar_lojas.html"><img src="imagens/editar-lojas.png" alt="Editar Lojas"></a>
                    </div>
                </div>

                <a href="index.html" class="sair"><button id="logout" class="btn btn-danger"><strong></strong> Sair</button></a>
            </div>
        </div>
    </div>

    <!-- Adicionando Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- Script JS -->
    <script src="js/editar_colaboradores.js"></script>
</body>

</html>
