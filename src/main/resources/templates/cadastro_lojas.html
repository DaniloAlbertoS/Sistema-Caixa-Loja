<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy6y8U0vx72HFXJJT2xV2W5B5slzwgXroF7lcoqH" crossorigin="anonymous">



    <link rel="stylesheet" href="css/cadastro_lojas.css">
    <style>
        /* Garantir que os botões mantenham a mesma aparência */
        .btn-custom {
            background-color: #007bff; /* Cor azul do botão */
            color: white;
            font-size: 16px; /* Tamanho de fonte para o botão */
            padding: 10px 20px;
            border-radius: 5px; /* Arredondar os cantos */
            border: none;
        }

        .btn-custom:hover {
            background-color: #0056b3; /* Cor de hover (quando o botão é clicado) */
            color: white;
        }

        .btn-secondary-custom {
            background-color: #6c757d; /* Cor do botão de reset */
            color: white;
            font-size: 16px;
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
        }

        .btn-secondary-custom:hover {
            background-color: #5a6268; /* Cor de hover para o botão de reset */
            color: white;
        }
    </style>
    <title>Cadastro de Lojas</title>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header text-center mb-5">
            <h1>Cadastro de Lojas</h1>
        </div>

        <div class="content">
            <div class="form-container">
                <form id="formCadastro">
                    <div class="mb-3">
                        <label for="id" class="form-label">ID:</label>
                        <input type="text" id="id" name="id" readonly class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="numero_loja" class="form-label">*Número da Loja:</label>
                        <input type="text" id="numero_loja" name="numero_loja" required class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="nome" class="form-label">*Nome:</label>
                        <input type="text" id="nome" name="nome" required class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="endereco" class="form-label">*Endereço:</label>
                        <input type="text" id="endereco" name="endereco" required class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="cidade" class="form-label">*Cidade:</label>
                        <input type="text" id="cidade" name="cidade" required class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="telefone" class="form-label">*Telefone:</label>
                        <input type="text" id="telefone" name="telefone" required class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">*Email:</label>
                        <input type="email" id="email" name="email" required class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="funcionamento" class="form-label">Funcionamento:</label>
                        <input type="text" id="funcionamento" name="funcionamento" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label for="cnpj" class="form-label">*CNPJ:</label>
                        <input type="text" id="cnpj" name="cnpj" required class="form-control">
                    </div>
                    
                    <!-- Mensagem de erro -->
                    <div id="mensagem" style="display:none; color: red;"></div>

                    <div class="form-buttons mt-3 d-flex justify-content-between">
                        <button type="submit" class="btn btn-custom"><strong></strong> Salvar</button>
                        <button type="reset" class="btn btn-secondary-custom"><strong></strong> Limpar</button>
                    </div>
                </form>
            </div>

            <!-- Informações do usuário -->
            <div class="user-info mt-4">
                <h2>Bem-vindo</h2>
                <p><strong>Usuário:</strong> <span id="user-name">Carregando...</span></p>
                <p><strong>Mat:</strong> <span id="user-mat">Carregando...</span></p>
                <div class="date-time">
                    <p><strong>Data Atual:</strong> <span id="current-date"></span></p>
                    <p><strong>Hora Atual:</strong> <span id="current-time"></span></p>
                </div>
                <div class="user-image text-center" data-tooltip="Tela Inicial">
                    <a href="/tela-financeiro"><img src="imagens/logo-de-usuarios.png" alt="Usuário" class="img-fluid"></a>
                </div>
                <div class="mini-menu">
                    <div class="mini-item"  data-tooltip="Cadastrar Colaboradores">
                       <a href="/cadastro-colaboradores"> <img src="imagens/lgo-cadastrar-colaboradores.png" alt="Colaboradores"></a>
                        
                    </div>
                    <div class="mini-item disabled"  data-tooltip="Cadastrar Loja">
                        <a href="/cadastro-lojas"><img src="imagens/cadastrar-loja.png" alt="Relatórios"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Colaboradores">
                        <a href="/listar-colaboradores"><img src="imagens/listar-colaboradores.png" alt="Listar Colaboradores"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Lojas">
                        <a href="/listar-lojas"><img src="imagens/listar-lojas.png" alt="Listar Lojas"></a>
                    </div>
                    <div class="mini-item"  data-tooltip="Editar Colaboradores">
                       <a href="/editar-colaboradores"> <img src="imagens/editar-colaboradores.png" alt="Documentos"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Editar Lojas">
                        <a href="/editar-lojas"><img src="imagens/editar-lojas.png" alt="Configurações"></a>
                    </div>
                </div>
                <a href="/" class="sair"><button id="logout" class="btn-sair"><strong></strong> Sair</button></a>
            </div>
                </div>
            
        </div>
    </div>

    <script src="js/cadastro_de_lojas.js"></script>
    <script src="js/informacoesusuario.js"></script>
    <script src="js/dataHoraAtual.js"></script>
    <script src="js/controleDeAltenticacao.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
