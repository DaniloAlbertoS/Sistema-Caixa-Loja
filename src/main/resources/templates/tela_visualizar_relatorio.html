<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/visualizar_relatorios.css">
    <title>Visualizar Relatórios Individuais</title>
</head>
<body>
    <div class="container">
        <!-- Conteúdo Principal -->
        <div class="content">
            <div class="header">
                <h1>Visualizar Relatórios Individuais</h1>
            </div>

            <!-- Informações do ID da Loja -->
            <!--<div class="info-line">
                <label for="store-id">ID da Loja:</label>
                <input type="text" id="store-id" value="12345" readonly>
            </div>--!>

            <!-- Filtro -->
            <div class="filter-section">
                <label for="filter">Filtrar por:</label>
                <input type="text" id="filter" placeholder="Valor caixa, Valor cofre, Despesas...">
                <button id="search-button">
                    <i class="fas fa-search"></i> Pesquisar
                </button>
            </div>

            <!-- Tabela de Relatórios -->
            <table class="report-table">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all"></th>
                        <th>ID</th>
                        <th>Data</th>
                        <th>Hora</th>
                        <th>Valor Caixa</th>
                        <th>Valor Cofre</th>
                        <th>Despesas</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Linhas preenchidas dinamicamente -->
                </tbody>
            </table>

            <!-- Botões de Ação -->
            <div class="action-buttons">
                <button class="btn-delete">[F7] Excluir</button>
                <button class="btn-cancel">[F8] Cancelar</button>
            </div>
        </div>

        <!-- Menu Lateral Direito -->
        <div class="user-info">
            <h2>Bem-vindo</h2>
    <p><strong>Usuário:</strong> <span id="user-name">Carregando...</span></p>
    <p><strong>Mat:</strong> <span id="user-mat">Carregando...</span></p>
    <div class="date-time">
        <p><strong>Data Atual:</strong> <span id="current-date"></span></p>
        <p><strong>Hora Atual:</strong> <span id="current-time"></span></p>
    </div>
            <div class="user-image" data-tooltip="Tela Inicial">
                <a href="/menu-gerencia"><img src="imagens/logo-de-usuarios.png" alt="Usuário"></a>
            </div>
            <div class="mini-menu">
                <div class="mini-item disabled"  data-tooltip="Visualizar Relatórios">
                    <a href="/visualizar-relatorio"><img src="imagens/visualizar_relatorios.png" alt="Visualizar Relatórios"></a>
                </div>
                <div class="mini-item"  data-tooltip="Visualizar Relatórios Diários">
                    <a href="/visualizar-relatorios-diarios"><img src="imagens/visualizar_relatorios_diarios.png" alt="Visualizar Envios Diários"></a>
                </div>
                <div class="mini-item" data-tooltip="Cadastrar Relatórios">
                    <a href="/cadastro-relatorios"><img src="imagens/cadastrar_relatorios.png" alt="Cadastrar Relatórios"></a>
                </div>
            </div>
            <a href="/" class="sair"><button id="logout" class="btn-sair"><strong></strong> Sair</button></a>
        </div>
        
    </div>

    <script src="js/visualizar_relatorio.js"></script>
    <script src="js/informacoesusuario.js"></script>
    <script src="js/dataHoraAtual.js"></script>
    <script src="js/controleDeAltenticacao.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
