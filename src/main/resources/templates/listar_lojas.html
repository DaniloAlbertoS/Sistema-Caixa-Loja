<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/listar_lojas.css">
    <title>Listar Lojas</title>
</head>
<body>
    <div class="main-container">
        <div class="content">
            <div class="header">
                <h1>Listar Lojas</h1>
                <input type="text" id="search-input" placeholder="Buscar loja...">
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="select-all"></th>
                            <th>Número da Loja</th>
                            <th>Nome</th>
                            <th>Endereço</th>
                            <th>Funcionamento</th>
                        </tr>
                    </thead>
                    <tbody id="store-list">
                        <!-- Os dados serão preenchidos dinamicamente -->
                    </tbody>
                </table>
            </div>
            <div class="action-buttons">
                <button class="btn-delete">Excluir Selecionados</button>
                <button class="btn-cancel">Cancelar</button>
            </div>
        </div>
        <div class="user-info">
            <h2>Bem-vindo</h2>
                <p><strong>Usuário:</strong> <span id="user-name">Carregando...</span></p>
                <p><strong>Mat:</strong> <span id="user-mat">Carregando...</span></p>
                <div class="date-time">
                    <p><strong>Data Atual:</strong> <span id="current-date"></span></p>
                    <p><strong>Hora Atual:</strong> <span id="current-time"></span></p>
                </div>
    <div class="user-image" data-tooltip="Tela Inicial">
                <a href="/tela-financeiro"><img src="imagens/logo-de-usuarios.png" alt="Usuário"></a>
            </div>
            <div class="mini-menu">
                <div class="mini-item"  data-tooltip="Cadastrar Colaboradores">
                   <a href="/cadastro-colaboradores"> <img src="imagens/lgo-cadastrar-colaboradores.png" alt="Colaboradores"></a>
                    
                </div>
                <div class="mini-item"  data-tooltip="Cadastrar Loja">
                    <a href="/cadastro-lojas"><img src="imagens/cadastrar-loja.png" alt="Relatórios"></a>
                </div>
                <div class="mini-item" data-tooltip="Listar Colaboradores">
                    <a href="/listar-colaboradores"><img src="imagens/listar-colaboradores.png" alt="Listar Colaboradores"></a>
                </div>
                <div class="mini-item disabled" data-tooltip="Listar Lojas">
                    <a href="/listar-lojas"><img src="imagens/listar-lojas.png" alt="Listar Lojas"></a>
                </div>
                <div class="mini-item"  data-tooltip="Editar Colaboradores">
                   <a href="/editar-colaboradores"> <img src="imagens/editar-colaboradores.png" alt="Documentos"></a>
                </div>
                <div class="mini-item" data-tooltip="Editar Lojas">
                    <a href="/editar-lojas"><img src="imagens/editar-lojas.png" alt="Configurações"></a>
                </div>
            </div>
            <a href="/" class="sair"><button id="logout" class="btn-sair"><strong></strong> Sair</button></a>
        </div>
    </div>
    <script src="js/listar_lojas.js"></script>
    <script src="js/informacoesusuario.js"></script>
    <script src="js/dataHoraAtual.js"></script>
    <script src="js/controleDeAltenticacao.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
