<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/cadastro_colaboradores_financeiro.css">
    <title>Cadastro Colaboradores Financeiro</title>
</head>
<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Cadastro Colaboradores Financeiro</h1>
        </div>

        <div class="content">
            <!-- Formulário -->
            <div class="form-container">
                <form id="formCadastro">
                    <label for="nome">*Nome:</label>
                    <input type="text" id="nome" name="nome" class="form-control" required>
                
                    <label for="cargo">*Cargo:</label>
                    <input type="text" id="cargo" name="cargo" class="form-control" required>
                
                    <label for="cpf">*CPF:</label>
                    <input type="text" id="cpf" name="cpf" class="form-control" required>
                
                    <label for="matricula">*Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" class="form-control" required>
                
                    <label for="situacao">*Situação:</label>
                    <select id="situacao" name="situacao" class="form-control">
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                
                    <div class="form-buttons">
                        <button type="submit" class="btn btn-primary"><strong></strong> Salvar</button>
                        <button type="reset" class="btn btn-secondary"><strong></strong> Limpar</button>
                    </div>
                </form>
                
                <div id="mensagem" style="display:none;"></div>
            </div>

            <!-- Informações do usuário -->
            <div class="user-info">
                <h2>Bem-vindo</h2>
                <p><strong>Usuário:</strong> <span id="user-name">Carregando...</span></p>
                <p><strong>Mat:</strong> <span id="user-mat">Carregando...</span></p>
                <div class="date-time">
                    <p><strong>Data Atual:</strong> <span id="current-date"></span></p>
                    <p><strong>Hora Atual:</strong> <span id="current-time"></span></p>
                </div>
                <div class="user-image" data-tooltip="Tela Inicial">
                    <a href="/tela-financeiro"><img src="imagens/logo-de-usuarios.png" alt="Usuário" class="img-fluid"></a>
                </div>
                <div class="mini-menu">
                    <div class="mini-item "  data-tooltip="Cadastrar Colaboradores">
                       <a href="/cadastro-colaboradores"> <img src="imagens/lgo-cadastrar-colaboradores.png" alt="Colaboradores"></a>
                        
                    </div>
                    <div class="mini-item"  data-tooltip="Cadastrar Loja">
                        <a href="/cadastro-lojas"><img src="imagens/cadastrar-loja.png" alt="Relatórios"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Colaboradores">
                        <a href="/listar-colaboradores"><img src="imagens/listar-colaboradores.png" alt="Listar Colaboradores"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Lojas">
                        <a href="/listar-lojas"><img src="imagens/listar-lojas.png" alt="Listar Lojas"></a>
                    </div>
                    <div class="mini-item"  data-tooltip="Editar Colaboradores">
                       <a href="/editar-colaboradores"> <img src="imagens/editar-colaboradores.png" alt="Documentos"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Editar Lojas">
                        <a href="/editar-lojas"><img src="imagens/editar-lojas.png" alt="Configurações"></a>
                    </div>
                </div>
                <a href="/" class="sair"><button id="logout" class="btn-sair"><strong></strong> Sair</button></a>
            </div>
        </div>
    </div>
    
    <!-- Scripts do Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <script src="js/cadastro_colaboradores.js"></script>
    <script src="js/informacoesusuario.js"></script>
    <script src="js/dataHoraAtual.js"></script>
    <script src="js/controleDeAltenticacao.js"></script>
    <script src="js/logout.js"></script>
</body>
</html>
