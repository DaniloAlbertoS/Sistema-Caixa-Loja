<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Adicionando Bootstrap CSS -->
    

    <link rel="stylesheet" href="css/editar_colaboradores.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <title>Cadastro de Colaboradores</title>
</head>

<body>
    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h1>Editar Colaboradores</h1>
        </div>

        <div class="content">
            <!-- Área da esquerda: Formulário de matrícula e edição -->
            <div class="form-container">
                <div class="search-bar">
                    <input type="text" id="matriculaPesquisar" placeholder="Digite a matrícula para pesquisar">
                    <button id="pesquisar">Pesquisar</button>
                </div>
                <div id="mensagem" class="mensagem"></div>
                <div class="form">
                    <div class="form-field">
                        <label for="nome">Nome:</label>
                        <input type="text" id="nome" placeholder="Nome do colaborador">
                    </div>
                    <div class="form-field">
                        <label for="cargo">Cargo:</label>
                        <input type="text" id="cargo" placeholder="Cargo do colaborador">
                    </div>
                    <div class="form-field">
                        <label for="cpf">CPF:</label>
                        <input type="text" id="cpf" placeholder="CPF do colaborador">
                    </div>
                    <div class="form-field">
                        <label for="situacao">Situação:</label>
                        <select id="situacao">
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                        </select>
                    </div>
                </div>
                <div class="form-buttons">
                    <button id="btnSalvar">Salvar</button>
                    <button id="btnLimpar">Limpar</button>
                    <button id="btnCancelar">Cancelar</button>
                </div>
            </div>

            <!-- Área da direita: Informações do usuário e cadastro de colaboradores -->
            <div class="user-info">
                <h2>Bem-vindo</h2>
                <p><strong>Usuário:</strong> <span id="user-name">Carregando...</span></p>
                <p><strong>Mat:</strong> <span id="user-mat">Carregando...</span></p>
                <div class="date-time">
                    <p><strong>Data Atual:</strong> <span id="current-date"></span></p>
                    <p><strong>Hora Atual:</strong> <span id="current-time"></span></p>
                </div>
                <div class="user-image" data-tooltip="Tela Inicial">
                    <a href="/tela-financeiro"><img src="imagens/logo-de-usuarios.png" alt="Usuário"></a>
                </div>
                <div class="mini-menu">
                    <div class="mini-item"  data-tooltip="Cadastrar Colaboradores">
                       <a href="/cadastro-colaboradores"> <img src="imagens/lgo-cadastrar-colaboradores.png" alt="Colaboradores"></a>
                        
                    </div>
                    <div class="mini-item"  data-tooltip="Cadastrar Loja">
                        <a href="/cadastro-lojas"><img src="imagens/cadastrar-loja.png" alt="Relatórios"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Colaboradores">
                        <a href="/listar-colaboradores"><img src="imagens/listar-colaboradores.png" alt="Listar Colaboradores"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Listar Lojas">
                        <a href="/listar-lojas"><img src="imagens/listar-lojas.png" alt="Listar Lojas"></a>
                    </div>
                    <div class="mini-item disabled"  data-tooltip="Editar Colaboradores">
                       <a href="/editar-colaboradores"> <img src="imagens/editar-colaboradores.png" alt="Documentos"></a>
                    </div>
                    <div class="mini-item" data-tooltip="Editar Lojas">
                        <a href="/editar-lojas"><img src="imagens/editar-lojas.png" alt="Configurações"></a>
                    </div>
                </div>
                <a href="/" class="sair"><button id="logout" class="btn-sair"><strong></strong> Sair</button></a>
            </div>
        </div>
    </div>

    <!-- Adicionando Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

    <!-- Script JS -->
    <script src="js/editar_colaboradores.js"></script>
    <script src="js/informacoesusuario.js"></script>
    <script src="js/dataHoraAtual.js"></script>
    <script src="js/controleDeAltenticacao.js"></script>
    <script src="js/logout.js"></script>
</body>

</html>
