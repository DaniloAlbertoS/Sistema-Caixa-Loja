<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!-- Logo da empresa -->
        <img src="imagens/logo-tipo.png" alt="Logo da Empresa" class="logo">

        <!-- Título -->
        <h2>Faça Login</h2>

        <!-- Formulário de Login -->
        <form id="loginForm">
            <div class="input-group">
                <i class="fas fa-user"></i>
                <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" >
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>

        <!-- Botão Saiba Mais -->
        <a href="saiba+.html"><button id="saibaMais"  class="btn-saiba-mais">Saiba+</button></a>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
